imports:
    - { resource: "sylius_behat_services.php" }
    - { resource: "../../Behat/Resources/services.php" }

# workaround needed for strange "test.client.history" problem
# see https://github.com/FriendsOfBehat/SymfonyExtension/issues/88
services:
    Symfony\Component\BrowserKit\AbstractBrowser: '@test.client'

    # Sylius Behat SecurityService stores auth tokens only in the HTTP session,
    # but AddItemToCartHandler checks TokenStorage (in-memory) via UserContextInterface.
    # This context populates TokenStorage after Behat login so command bus handlers
    # see the logged-in user.
    Tests\ThreeBRS\SyliusPacketaPlugin\Behat\Context\Hook\TokenStorageResetContext:
        arguments:
            - '@security.token_storage'
            - '@sylius.behat.shared_storage'
        public: true
